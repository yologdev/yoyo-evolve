# yoyo configuration for the evolution loop.
#
# Every workflow passes `--model "$MODEL"` from the MODEL secret, which
# overrides the `model` line below; `provider` is read only from here. Keep the
# two in sync — a model id sent to the wrong provider fails on every call.
#
# 2026-09-27: back on Anthropic, now Claude Opus 5.5 (was DeepSeek V4.1-Flash
# from 2026-09-15). Between 2026-09-26 19:38 and this commit the file had been
# overwritten by the setup wizard (a unit test runs the real wizard in the repo
# root; see the issue filed the same day) to provider = "anthropic" while MODEL
# still carried the DeepSeek id, so every agent call in Days 210-211 got HTTP
# 404 and the sessions still reported green.
provider = "anthropic"
model = "claude-opus-5-5"

# Reasoning effort. yoagent 0.18.1 sends Opus 5.5 adaptive thinking with
# output_config.effort = "high" (yoyo matches claude-opus-5-5 to the Opus 5
# preset by prefix). Opus 5.5's own default effort is "medium", so this line is
# what keeps the loop at high. Thinking cannot be disabled on Opus 5.5.
thinking = "high"

# Output ceiling: Opus 5.5's maximum is exactly 128000. 131072 (the DeepSeek-era
# value) is rejected with HTTP 400 "max_tokens: 131072 > 128000" on every call
# (run 36328548109, 2026-09-27).
max_tokens = 128000

# Context window. Opus 5.5 accepts 1M. 750000 rather than 1M because yoyo hands
# yoagent 80% of this value as the MESSAGE budget and declares a 4_000-token
# system prompt (agent_builder.rs, ContextConfig) that is far larger in
# practice, so a full 1M could let a request exceed the provider's hard 1M.
# 750K keeps the total under it with margin and does not compact a normal
# session. History of this value (the Day-199 first-turn compaction, #925,
# #926) is in the DeepSeek-era commits 61797c93 and 8ce1d5bc.
context_window = 750000

auto_watch = true

# #794: evolve-loop agents run piped (stdin is not a tty), so they take
# run_piped_mode's auto-continue loop. Opt in here rather than in
# scripts/evolve.sh, which is protected. Delete this line to turn it off.
continue_on_silence = true

# #997: evolve.sh tees agent output, so stdout is never a terminal and #976
# refuses a retry once text has streamed; one transient Overloaded then killed
# a whole phase. Opt in: retry anyway, accepting a duplicate partial in the log.
retry_after_partial = true
