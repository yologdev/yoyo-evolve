# yoyo configuration — generated by setup wizard
#
# 2026-09-15: the loop moved from Anthropic (claude-opus-4-6 here; the MODEL
# secret carried claude-opus-5 for the workflows) to DeepSeek V4.1-Flash as a
# measured experiment — see CLAUDE.md, "What This Is". Every workflow that runs
# yoyo passes `--model "$MODEL"` from the MODEL secret, which overrides the
# `model` line below; keep the two in sync.
provider = "deepseek"
# 2026-09-15 (later the same evening): "deepseek-v4-flash" rather than the
# canonical "deepseek-flash". DeepSeek's pricing page lists it as a legacy
# name that is still accepted and served by DeepSeek-V4.1-Flash at the Flash
# price; it is what the MODEL secret carries, and it is in yoyo's known-model
# list so the "Unknown model" warning stays quiet. #923 tracks teaching that
# list the canonical id.
model = "deepseek-v4-flash"

# Reasoning effort. yoyo maps "high" to DeepSeek `reasoning_effort: "high"` on
# yoagent 0.18.1; DeepSeek's top rung is "max", which needs the yoagent-side
# mapping (branch deepseek-max-effort in yoagent-repo) and a release before
# yoyo can send it. "max" here is only an alias for high today, and "high" is
# also DeepSeek's own default once thinking is on.
thinking = "high"

# Output ceiling. yoyo's DeepSeek arm builds from yoagent's own
# `ModelConfig::deepseek` preset, whose declared output ceiling is 384000 —
# not the 4096 the OpenAI-compatible base config carries (#943; before that
# change this arm inherited the base config and a ceiling check written
# against it would have silently cut this value to 4K).
# DeepSeek accepts 1..393216 and defaults to 64K in thinking mode
# (128K at reasoning_effort "max"); 128K is its documented top default.
max_tokens = 131072

# Context window. yoyo's OpenAI-compatible base config reports 128K; yoagent's
# own `deepseek` preset and DeepSeek's pricing page both say V4.1-Flash accepts
# 1M, and 1M is what this key must be here — measured in the first DeepSeek
# session (run 35027735847, 2026-09-15): every loop invocation carries a
# ~550K-token prompt (CLAUDE.md alone is ~360K tokens and rides in the system
# prompt), Opus-5's preset window is 1,000,000 so Opus never compacted, and
# under a 128K/200K window yoyo compacted on the FIRST turn — the system prompt
# cannot be compacted, so it deleted the user task: A1 produced no assessment,
# A2 produced 0 tasks twice, the evaluator wrote no verdict file (#925).
# Superseded rationale, recorded rather than erased: this used to be 200000
# "to match the Opus-5 window the loop's compaction behaviour was tuned
# against" — the Opus-5 preset is 1M, so that comparison was never true.
# Restored to a live key by yoyo in 8ce1d5bc (#924) after being commented out
# earlier the same evening.
#
# Why 750000 and not the full 1M: yoyo hands yoagent 80% of this value as the
# MESSAGE budget and tells it the system prompt is 4_000 tokens
# (agent_builder.rs, ContextConfig), while the real system prompt is ~360K.
# At 1M the messages could reach ~796K before compaction, i.e. ~1.16M in total,
# past DeepSeek's hard 1M limit. 750K caps messages at ~596K (total ~956K),
# leaves margin for yoagent's token estimator, and still never compacts a
# normal session (Opus sessions ran ~550K total). The 4_000 constant is the
# defect; it is yoyo's to fix (agent-input issue filed 2026-09-15).
context_window = 750000

# preserved from previous config
auto_watch = true

# #794: evolve-loop agents run piped (stdin is not a tty), so they take
# run_piped_mode's auto-continue loop. Opt in here rather than in
# scripts/evolve.sh, which is protected. Delete this line to turn it off.
continue_on_silence = true
