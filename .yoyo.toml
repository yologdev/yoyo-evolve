# yoyo configuration — generated by setup wizard
#
# 2026-09-15: the loop moved from Anthropic (claude-opus-4-6 here; the MODEL
# secret carried claude-opus-5 for the workflows) to DeepSeek V4.1-Flash as a
# measured experiment — see CLAUDE.md, "What This Is". Every workflow that runs
# yoyo passes `--model "$MODEL"` from the MODEL secret, which overrides the
# `model` line below; keep the two in sync.
provider = "deepseek"
# 2026-09-15 (later the same evening): "deepseek-v4-flash" rather than the
# canonical "deepseek-flash". DeepSeek's pricing page lists it as a legacy
# name that is still accepted and served by DeepSeek-V4.1-Flash at the Flash
# price; it is what the MODEL secret carries, and it is in yoyo's known-model
# list so the "Unknown model" warning stays quiet. #923 tracks teaching that
# list the canonical id.
model = "deepseek-v4-flash"

# Reasoning effort. yoyo maps "high" to DeepSeek `reasoning_effort: "high"` on
# yoagent 0.18.1; DeepSeek's top rung is "max", which needs the yoagent-side
# mapping (branch deepseek-max-effort in yoagent-repo) and a release before
# yoyo can send it. "max" here is only an alias for high today, and "high" is
# also DeepSeek's own default once thinking is on.
thinking = "high"

# Output ceiling. yoyo's DeepSeek arm inherits max_tokens=4096 from the
# OpenAI-compatible base config, which would cap reasoning + answer at 4K
# tokens. DeepSeek accepts 1..393216 and defaults to 64K in thinking mode
# (128K at reasoning_effort "max"); 128K is its documented top default.
max_tokens = 131072

# Context window. The same base config reports 128K; V4.1-Flash accepts 1M.
# 200K is kept deliberately: it matches the Opus-5 window the loop's
# compaction behaviour was tuned against, so sessions stay comparable, and
# DeepSeek's own stated weakness is sparse retrieval over very long contexts.
#
# Commented out 2026-09-15 (evening) — restore once #924 lands.
# cli::tests::test_lite_flag_sets_context_window reads THIS file through
# parse_args (cargo test runs from the repo root), so this line made the test
# assert Some(200000) against the --lite default and `cargo test` went red on
# main; every evolve session then died at its Step-1 `cargo test` (run
# 35024292007, attempt 1: 129s). Fixing the test is yoyo's job, filed as
# #924 with the reference patch. Until then the DeepSeek arm reports the 128K
# window yoagent's OpenAI-compatible base config gives it.
context_window = 200000

# preserved from previous config
auto_watch = true

# #794: evolve-loop agents run piped (stdin is not a tty), so they take
# run_piped_mode's auto-continue loop. Opt in here rather than in
# scripts/evolve.sh, which is protected. Delete this line to turn it off.
continue_on_silence = true
