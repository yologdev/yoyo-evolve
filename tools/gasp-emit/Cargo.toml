# Standalone GASP emitter — deliberately NOT part of yoyo's own crate, so the
# self-evolving agent's build/tests never depend on it. Built by
# scripts/gasp_shim.sh via --manifest-path into the main target/ dir.
[package]
name = "gasp-emit"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
yoagent-state = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"

[workspace]
