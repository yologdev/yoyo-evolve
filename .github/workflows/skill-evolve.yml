name: Skill Evolution

on:
  schedule:
    # Every 4h at :30 (off-phase from evolve's :00). Was hourly until Day 163.
    # Every fire enters the shared `evolution` concurrency group below, and GitHub
    # keeps only ONE pending run per group — so a no-op fire EVICTS whatever is
    # queued, including a full scheduled evolve session. Measured 2026-08-10:
    # 24 fires/day evicting ~33% of scheduled evolve runs, to serve a gate
    # (counter >= 5 sessions) that has actually fired twice since 2026-05-25.
    # At ~8 evolve sessions/day the counter reaches 5 within hours, so a 4h
    # cadence still gives 6 chances/day and loses no responsiveness.
    - cron: '30 */4 * * *'
  workflow_dispatch:       # manual trigger for testing

concurrency:
  group: evolution             # shared with evolve.yml — GitHub serializes both workflows
  cancel-in-progress: false    # queue, don't kill an in-flight cycle

permissions:
  contents: write
  issues: read

jobs:
  skill-evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 50
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup GitHub CLI
        run: gh auth status
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Install RTK for CLI output compression. Same purpose as in evolve.yml.
      # Fail-soft: native fallback at src/format/output.rs handles absence.
      - name: Install RTK (output compression)
        continue-on-error: true
        run: |
          if ! command -v rtk &>/dev/null; then
            curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh || true
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          rtk --version || echo "RTK install failed; agent will use native compressor"

      # Install xurl for the x-research skill. Same purpose as in evolve.yml.
      # Fail-soft: token absence leaves the skill unavailable but the cycle
      # proceeds — skill-evolve doesn't typically invoke x-research anyway.
      - name: Install xurl (x-research skill)
        continue-on-error: true
        run: |
          if ! command -v xurl &>/dev/null; then
            cargo install xurl
          fi
          xurl --version || echo "::warning::xurl install failed; x-research skill will be unavailable"

      - name: Detect bot identity
        id: bot-info
        run: |
          SLUG="${{ steps.bot-token.outputs.app-slug }}"
          if [ -z "$SLUG" ]; then
            echo "::error::GitHub App slug is empty."
            exit 1
          fi
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "login=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "${{ steps.bot-info.outputs.login }}"
          git config user.email "${{ steps.bot-info.outputs.email }}"

      - name: Run skill-evolve cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
          MODEL: ${{ secrets.MODEL || 'claude-opus-4-6' }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_INSTALLATION_ID: ${{ secrets.APP_INSTALLATION_ID }}
          BOT_LOGIN: ${{ steps.bot-info.outputs.login }}
          BOT_SLUG: ${{ steps.bot-info.outputs.slug }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          chmod +x scripts/skill_evolve.sh
          ./scripts/skill_evolve.sh
