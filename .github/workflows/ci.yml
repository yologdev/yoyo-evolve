name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Lint evolve.sh heredocs
        run: python3 scripts/lint_evolve_heredocs.py

      - name: Harness logic tests
        # Structural checks on evolve.sh's decision logic: budget arithmetic,
        # gate thresholds vs the timeouts they cover, coupled numbers matching
        # their prompt text, and function-definition ordering. bash -n only
        # proves it parses.
        run: bash tests/harness_logic.sh

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt -- --check
