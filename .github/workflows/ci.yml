name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Lint evolve.sh heredocs
        run: python3 scripts/lint_evolve_heredocs.py

      - name: Build GASP delivery validator
        run: cargo build --locked --manifest-path scripts/gasp-delivery-validator/Cargo.toml --target-dir target/gasp-delivery-validator

      - name: Python harness tests
        # scripts/test_scan_commitments.py existed but no workflow ran it; it
        # went red unnoticed and hid a real AttributeError crash path.
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Trajectory extractor self-tests
        # extract_trajectory.py carries its own offline self-tests (--test,
        # ~0.1s) but lives outside the unittest discovery above, so nothing ran
        # them; #951 named this after the extractor was nearly shipped through
        # the ungated wrap-up sweep.
        run: python3 scripts/extract_trajectory.py --test

      - name: Harness logic tests
        # Structural checks on evolve.sh's decision logic: budget arithmetic,
        # gate thresholds vs the timeouts they cover, coupled numbers matching
        # their prompt text, and function-definition ordering. bash -n only
        # proves it parses.
        run: bash tests/harness_logic.sh

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      # The `gasp` feature is default-off (#683), so every gate above compiles
      # without it and src/gasp.rs — module, unit tests and all — was verified
      # by nothing. Day 164 also lost a session to `yoagent-state` failing to
      # resolve under this feature, which a featureless pipeline cannot see.
      # This is the only place the feature is exercised; evolve.sh deliberately
      # does not build it (see the note there).
      - name: Test (--features gasp)
        run: cargo test --locked --features gasp

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy (--features gasp)
        run: cargo clippy --locked --all-targets --features gasp -- -D warnings

      - name: Format check
        run: cargo fmt -- --check
