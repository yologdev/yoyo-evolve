name: Flush Cloudflare Twitter Memory
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evolution
  cancel-in-progress: false
jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Flush Cloudflare Twitter memory under the shared writer lock
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/yoyo-writeback
        with:
          runtime-read-key: ${{ secrets.YOYO_RUNTIME_READ_KEY }}
          source-token: ${{ secrets.GH_PAT }}
          worker-secret: ${{ secrets.YOYO_WORKER_ADMIN_SECRET }}
