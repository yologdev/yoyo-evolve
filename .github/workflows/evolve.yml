name: Evolution

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'  # 4 runs/day on a clean 6h spacing (was 3/day at 04/13/20 until 2026-09-22), and the HOURS DO NOT CONTROL WHEN RUNS ACTUALLY START — measured 2026-09-21 over 33 scheduled runs, GitHub fires this workflow 2-8h late (median +5h06m on the 04:00 slot, +3h53m on 13:00, +2h35m on 20:00; it has never once been under 2h). Treat these hours as a request, not a schedule. THE PRICE ARGUMENT THAT USED TO JUSTIFY THEM IS RETIRED: it reasoned that DeepSeek bills 2x during 01:00-04:00 and 06:00-10:00 UTC Mon-Fri, so a slot needed both its start hour and the hour it runs into off-peak — true about DeepSeek, but it assumed the cron is punctual, and a 5h median delay is larger than the windows being dodged. Measured exposure is 5 of 33 runs starting in peak (15%, weekday mornings only — Sat/Sun are off-peak by DeepSeek's own rule), costing about $2.59/month against a ~$17/month bill, so it is not worth contorting the schedule for; the only fix that would actually work is checking the clock inside the session, which trades a $0.19 session for a lost one. Collision avoidance by hour is unreliable for the same reason; the shared `evolution` concurrency group is what actually serialises evolve/dream/skill-evolve, and noon is still worth avoiding because synthesize.yml runs at `0 12` with NO concurrency group and rewrites memory/active_learnings.md (injected into every session) and pushes. Noon stays avoided on its own merits, since synthesize.yml runs at `0 12` with NO concurrency group. The 4th slot was added 2026-09-22 against a measured-healthy loop: 32 scheduled runs, ZERO evictions, actual start-to-start spacing min 4.5h / median 8.2h against a 2.83h job timeout. At 6h nominal the expected floor drops to roughly 3.4h, so the margin narrows from ~1.6x to ~1.2x — the thing to watch is the shared `evolution` concurrency group, which holds only ONE pending run, so a third simultaneous fire evicts a queued session (the failure a882b51f fixed). Superseded: 2/day (03:00,15:00) 2026-09-15..16 for the Opus weekly limit; a flat 3h gap Day 162..2026-09-15; 8h before Day 162. The cadence is NOT restated in CLAUDE.md — this line is the only source.
  workflow_dispatch:       # manual trigger for testing

concurrency:
  group: evolution
  cancel-in-progress: false  # queue new runs, don't cancel in-progress ones

permissions:
  contents: write
  issues: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 170  # MUST stay under the cron gap (6h since 2026-09-22; 8h 2026-09-16..09-22, 12h before that, 3h before that) — 170min is 2.83h, so the headroom over the nominal gap fell from 2.8x to 2.1x when the 4th slot landed: at 210 a long run's successor queued and was then cancelled by the :30 tick, silently dropping a whole slot. YOYO_SESSION_BUDGET_SECS + JOB_DEADLINE_EPOCH wind the session down before this.

    steps:
      - name: Set job deadline
        # One wall-clock deadline shared by all attempts. Each retry re-runs
        # evolve.sh with a fresh SESSION_T0, so per-attempt budgets alone
        # cannot see how much of the 210-min job clock is already spent —
        # evolve.sh clamps its budget to this epoch (minus a wrap margin).
        run: |
          echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "JOB_DEADLINE_EPOCH=$(( $(date +%s) + 170*60 ))" >> "$GITHUB_ENV"  # keep in lockstep with timeout-minutes above

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 50
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup GitHub CLI
        run: gh auth status
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Install RTK (Rust Token Killer — github.com/rtk-ai/rtk) for CLI output
      # compression. yoyo's `maybe_prefix_rtk()` auto-prefixes supported
      # commands when `rtk` is on PATH; falls back to native compressor in
      # `src/format/output.rs` if absent. Especially leveraged by
      # analyze-trajectory which fetches large `gh run view --log-failed`
      # artifacts. Fail-soft: install failure does not block the session.
      - name: Install RTK (output compression)
        continue-on-error: true
        run: |
          if ! command -v rtk &>/dev/null; then
            curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh || true
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          # Verify (non-fatal — agent has a native fallback)
          export PATH="$HOME/.local/bin:$PATH"
          rtk --version || echo "RTK install failed; agent will use native compressor"

      # Install xurl for the x-research skill. Token (X_BEARER_TOKEN) is wired
      # into the agent run step's env block, where the skill actually executes.
      # Fail-soft: install failure leaves the skill unavailable but does not
      # block the session. The skill body falls back to "auth not configured;
      # skill unavailable this session" when neither xurl+~/.xurl nor
      # X_BEARER_TOKEN are present.
      - name: Install xurl (x-research skill)
        continue-on-error: true
        run: |
          if ! command -v xurl &>/dev/null; then
            cargo install xurl
          fi
          xurl --version || echo "::warning::xurl install failed; x-research skill will be unavailable"

      - name: Detect bot identity
        id: bot-info
        run: |
          SLUG="${{ steps.bot-token.outputs.app-slug }}"
          if [ -z "$SLUG" ]; then
            echo "::error::GitHub App slug is empty. Check that your GitHub App is configured correctly."
            exit 1
          fi
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "login=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "${{ steps.bot-info.outputs.login }}"
          git config user.email "${{ steps.bot-info.outputs.email }}"

      - name: Notify dashboard (start)
        if: vars.DASHBOARD_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          gh api repos/${{ vars.DASHBOARD_REPO }}/dispatches \
            -f event_type=activity-update \
            -f 'client_payload[action]=start' \
            -f 'client_payload[workflow]=Evolution' || true

      - name: Lint evolve.sh heredocs
        run: python3 scripts/lint_evolve_heredocs.py

      - name: Run evolution session
        id: attempt1
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
          MODEL: ${{ secrets.MODEL || 'claude-opus-4-6' }}
          YOYO_SESSION_BUDGET_SECS: '10800'  # per-attempt cap; JOB_DEADLINE_EPOCH (above) clamps all attempts to the shared job clock
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_INSTALLATION_ID: ${{ secrets.APP_INSTALLATION_ID }}
          BOT_LOGIN: ${{ steps.bot-info.outputs.login }}
          BOT_SLUG: ${{ steps.bot-info.outputs.slug }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          YOPEDIA_AGENT_TOKEN: ${{ secrets.YOPEDIA_AGENT_TOKEN }}
          YOPEDIA_VAULT_ID: ${{ secrets.YOPEDIA_EVOLVE_VAULT_ID }}
        run: |
          chmod +x scripts/evolve.sh
          ./scripts/evolve.sh

      - name: Retry after 15min
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
          MODEL: ${{ secrets.MODEL || 'claude-opus-4-6' }}
          YOYO_SESSION_BUDGET_SECS: '7200'  # per-attempt cap (must exceed ~4950s: A-phases 1200 + one task 3750 — review finding); deadline clamps it
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_INSTALLATION_ID: ${{ secrets.APP_INSTALLATION_ID }}
          BOT_LOGIN: ${{ steps.bot-info.outputs.login }}
          BOT_SLUG: ${{ steps.bot-info.outputs.slug }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          YOPEDIA_AGENT_TOKEN: ${{ secrets.YOPEDIA_AGENT_TOKEN }}
          YOPEDIA_VAULT_ID: ${{ secrets.YOPEDIA_EVOLVE_VAULT_ID }}
        run: |
          echo "Waiting 15 minutes before retry..."
          sleep 900
          ./scripts/evolve.sh

      - name: Retry after 45min
        id: attempt3
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
          MODEL: ${{ secrets.MODEL || 'claude-opus-4-6' }}
          YOYO_SESSION_BUDGET_SECS: '5400'  # per-attempt cap (was 2700 — BELOW the 3750s task gate: attempt 3 could never run a task); deadline clamps it
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_INSTALLATION_ID: ${{ secrets.APP_INSTALLATION_ID }}
          BOT_LOGIN: ${{ steps.bot-info.outputs.login }}
          BOT_SLUG: ${{ steps.bot-info.outputs.slug }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          YOPEDIA_AGENT_TOKEN: ${{ secrets.YOPEDIA_AGENT_TOKEN }}
          YOPEDIA_VAULT_ID: ${{ secrets.YOPEDIA_EVOLVE_VAULT_ID }}
        run: |
          echo "Waiting 45 minutes before retry..."
          sleep 2700
          ./scripts/evolve.sh

      - name: Report exhausted evolution retries
        if: always() && steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure' && steps.attempt3.outcome == 'failure'
        run: |
          echo "::error::All three evolution attempts failed; no completed session was recorded."
          exit 1

      - name: Report GASP delivery needing recovery
        if: always()
        env:
          ATTEMPT1_DELIVERY: ${{ steps.attempt1.outputs.gasp_delivery }}
          ATTEMPT2_DELIVERY: ${{ steps.attempt2.outputs.gasp_delivery }}
          ATTEMPT3_DELIVERY: ${{ steps.attempt3.outputs.gasp_delivery }}
        run: |
          for delivery in "$ATTEMPT1_DELIVERY" "$ATTEMPT2_DELIVERY" "$ATTEMPT3_DELIVERY"; do
            case "$delivery" in
              saved_for_recovery|local_only)
                echo "::error::GASP delivery is $delivery. Recover the existing record; do not rerun evolution."
                exit 1 ;;
            esac
          done

      - name: Check for clippy warnings
        if: always()
        run: cargo clippy --quiet --all-targets 2>&1 || true

      - name: Notify dashboard (end)
        if: always() && vars.DASHBOARD_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          gh api repos/${{ vars.DASHBOARD_REPO }}/dispatches \
            -f event_type=activity-update \
            -f 'client_payload[action]=end' \
            -f 'client_payload[workflow]=Evolution' \
            -f 'client_payload[conclusion]=${{ job.status }}' || true
          gh api repos/${{ vars.DASHBOARD_REPO }}/dispatches \
            -f event_type=dashboard-update || true

      - name: Flush Cloudflare Twitter memory under the shared writer lock
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/yoyo-writeback
        with:
          runtime-read-key: ${{ secrets.YOYO_RUNTIME_READ_KEY }}
          source-token: ${{ secrets.GH_PAT }}
          worker-secret: ${{ secrets.YOYO_WORKER_ADMIN_SECRET }}
