[package]
name = "yoyo-agent"
version = "0.4.0"
edition = "2021"
description = "A coding agent that evolves itself. Born as 200 lines of Rust, growing up in public."
license = "MIT"
repository = "https://github.com/yologdev/yoyo-evolve"
homepage = "https://yologdev.github.io/yoyo-evolve"
documentation = "https://yologdev.github.io/yoyo-evolve/book/"
readme = "README.md"
keywords = ["agent", "cli", "coding-agent", "ai", "llm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "yoyo"
path = "src/main.rs"

[features]
# Default-off. Plain `cargo build` / `cargo test` — what yoyo runs while
# modifying itself — must never pull in `yoagent-state`. The self-evolving
# agent's build and tests do not depend on state instrumentation.
default = []
gasp = ["yoagent/gasp"]

[dependencies]
yoagent = { version = "0.27", features = ["openapi"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rustyline = "15"
async-trait = "0.1"
glob = "0.3"
regex = "1"
base64 = "0.22"
tokio-util = "0.7.18"
# #1184: the real TOML parser gates every loaded config file (slice 1);
# readers still use the hand parser until later slices move them.
toml = { version = "1", features = ["preserve_order"] }

# Unix-only: restore default SIGPIPE disposition in main() so piped output
# (`yoyo <subcmd> | head`) doesn't panic. Already in Cargo.lock transitively.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# #1138: the TLS pre-flight asks the SAME loader reqwest's platform verifier
# uses on these targets whether SSL_CERT_FILE / SSL_CERT_DIR load any CA cert,
# so yoyo refuses exactly the env that would panic and nothing else. Already
# in Cargo.lock transitively (rustls-platform-verifier -> rustls-native-certs).
[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
rustls-native-certs = "0.8"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
